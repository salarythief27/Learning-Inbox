{% extends "base.html" %}

{% block title %}ページが見つかりません | Learning Inbox{% endblock %}

{% block content %}
<div class="error-page text-center bg-white shadow-sm rounded p-4 p-md-5">
    <p class="error-code text-secondary mb-2">404</p>
    <h1 class="h2 mb-3">ページが見つかりません</h1>
    <p class="text-secondary mb-4">
        URLが間違っているか、ページが削除された可能性があります。
    </p>
    <a class="btn btn-primary" href="{{ url_for('index') }}">トップページへ戻る</a>
</div>
{% endblock %}
